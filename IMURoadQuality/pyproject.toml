[project]
name = "imu-road-quality"
version = "0.1.0"
description = "Classify road bumpiness (very bad / bad / unpaved / paved) from smartphone IMU + GPS recordings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "numpy>=2.4.3",
    "pandas>=2.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "tqdm>=4.67.3",
    "matplotlib>=3.9.0",
    "branca>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imu_road_quality"]

[tool.uv.sources]
