[project]
name = "cameroon-proximity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "geopandas",
  "folium",
  "osmnx>=1.9",
  "h3>=4",
  "rasterio",
  "networkx",
  "shapely",
  "pandas",
  "numpy",
  "polars",
  "scikit-learn",
  "osm2geojson",
  "requests",
  "branca",
  "mapclassify",
  "jinja2",
]

[project.optional-dependencies]
dev = []

