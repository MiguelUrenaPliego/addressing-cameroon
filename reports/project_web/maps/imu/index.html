<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>IMU Road Quality — Experiments</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #bar {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 8px 16px; border-radius: 0 0 8px 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); text-align: center;
  }
  #bar label { font-size: 13px; margin-right: 8px; }
  #bar select { font-size: 14px; padding: 4px 8px; }
  #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="bar">
  <label for="map-select">Map:</label>
  <select id="map-select">
  <optgroup label="Cameroon">
    <option value="Cameroon/outputs/Fotouni_25_03_2026__2026-03-25_09-32-13/road_quality_map.html">Fotouni_25_03_2026__2026-03-25_09-32-13</option>
    <option value="Cameroon/outputs/Fotouni_25_03_2026__2026-03-25_15-03-36/road_quality_map.html">Fotouni_25_03_2026__2026-03-25_15-03-36</option>
    <option value="Cameroon/outputs/Fotouni_25_03_2026__2026-03-25_15-15-53/road_quality_map.html">Fotouni_25_03_2026__2026-03-25_15-15-53</option>
    <option value="Cameroon/outputs/Fotouni_Douala_26_03_2026__2026-03-26_08-44-46/road_quality_map.html">Fotouni_Douala_26_03_2026__2026-03-26_08-44-46</option>
    <option value="Cameroon/outputs/Fotouni_Douala_26_03_2026__2026-03-26_13-16-53/road_quality_map.html">Fotouni_Douala_26_03_2026__2026-03-26_13-16-53</option>
  </optgroup>
  </select>
</div>
<iframe id="viewer" src="Cameroon/outputs/Fotouni_25_03_2026__2026-03-25_09-32-13/road_quality_map.html"></iframe>
<script>
  const select = document.getElementById("map-select");
  const viewer = document.getElementById("viewer");
  select.addEventListener("change", () => {
    viewer.src = select.value;
  });
</script>
</body>
</html>
